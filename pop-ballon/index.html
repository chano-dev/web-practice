<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explode this balloon</title>
    <style>
        /* Eric Meyer's Reset CSS v2.0 */
        html,body,div,span,applet,object,iframe,h1,h2,h3,h4,h5,h6,p,
        blockquote,pre,a,abbr,acronym,address,big,cite,code,del,dfn,em,
        img,ins,kbd,q,s,samp,small,strike,strong,sub,sup,tt,var,b,u,i,
        center,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,
        tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,embed,
        figure,figcaption,footer,header,hgroup,menu,nav,output,ruby,
        section,summary,time,mark,audio,video{margin:0;padding:0;border:0;
        font-size:100%;font:inherit;vertical-align:baseline}
        article,aside,details,figcaption,figure,footer,header,hgroup,
        menu,nav,section{display:block}
        body{line-height:1}
        ol,ul{list-style:none}
        blockquote,q{quotes:none}
        blockquote:before,blockquote:after,q:before,q:after{content:'';content:none}
        table{border-collapse:collapse;border-spacing:0}

        /* Estilos do exercício */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="balloon"></div>

    <script>
        var balloon = document.getElementById('balloon');
        var size = 200;
        var colorIndex = 0;
        var colors = ['red', 'green', 'blue'];

        // Click — cresce 10px e muda cor
        balloon.addEventListener('click', function () {
            size = size + 10;
            colorIndex = colorIndex + 1;

            // Volta ao início do array quando passa do último
            if (colorIndex > 2) {
                colorIndex = 0;
            }

            // Explode se passou de 420px
            if (size > 420) {
                size = 200;
                colorIndex = 0;
            }

            balloon.style.width = size + 'px';
            balloon.style.height = size + 'px';
            balloon.style.backgroundColor = colors[colorIndex];
        });

        // Mouse leave — encolhe 5px e muda cor ao contrário
        balloon.addEventListener('mouseleave', function () {
            size = size - 5;

            // Não pode ser menor que 200px
            if (size < 200) {
                size = 200;
            }

            colorIndex = colorIndex - 1;

            // Volta ao fim do array quando passa do primeiro
            if (colorIndex < 0) {
                colorIndex = 2;
            }

            balloon.style.width = size + 'px';
            balloon.style.height = size + 'px';
            balloon.style.backgroundColor = colors[colorIndex];
        });
    </script>
</body>
</html>
