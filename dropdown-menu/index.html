<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project for learning web Programming">
    <link rel="stylesheet" href="style.css">

    <title>Dropdwon-menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        ul, li, a {
            text-decoration: none;
            list-style: none;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: whitesmoke;
            padding: 15px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        nav {
            width: 100%;
            border-radius: 15px;
        }
        ul {
            display: flex;
            background-color: #1e1e1e;
            border-radius: 5px;
            flex-direction: row;
            gap: 15px;
        }
        nav ul li {
            padding: 15px;
            transition: all 0.1s ease-in-out;
            position: relative;
        }
        nav ul li a {
            font-size: 15px;
            font-weight: normal;

        }
        nav ul li:hover {
            background-color: #c3c3c3;
        }
        nav ul li:hover .drop {
            display: flex;
        }
        .drop {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 48px;
            left: 0;
            background-color: #1e1e1e;
            border-radius: 5px;
        }
        .drop li {
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.4);
        }


 
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Random</a></li>
            <li>
                <a href="#">Random</a>
                <ul class="drop">
                    <li><a href="">Random</a></li>
                    <li><a href="">Random</a></li>
                    <li><a href="">Random</a></li>
                    <li><a href="">Random</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Random</a>
                <ul class="drop">
                    <li><a href="">Random</a></li>
                    <li><a href="">Random</a></li>
                    <li><a href="">Random</a></li>
                    <li><a href="">Random</a></li>
                </ul>
            </li>
            <li><a href="#">Random</a></li>
        </ul>
    </nav>
</body>
</html>
